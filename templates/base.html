<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Campaign Analytics{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='charts.js') }}"></script>
</head>
<body>
<nav>
  <b>Campaign Analytics</b>
  <a href="{{ url_for('overview') }}" class="{{ 'on' if request.endpoint == 'overview' }}">Overview</a>
  <a href="{{ url_for('channels') }}" class="{{ 'on' if request.endpoint == 'channels' }}">Channels</a>
  <a href="{{ url_for('campaigns') }}" class="{{ 'on' if request.endpoint == 'campaigns' }}">Campaigns</a>
</nav>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
